name: Update Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Light Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: abneralmeidacord
          options: "bg_color=ffffff&color=24292f&title_color=24292f&line=0969da&point=0969da&area=true&area_color=54aeff&hide_border=true"
          output_path: dist/activity-graph-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Dark Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: abneralmeidacord
          options: "bg_color=0d1117&color=c9d1d9&title_color=c9d1d9&line=58a6ff&point=58a6ff&area=true&area_color=1f6feb&hide_border=true"
          output_path: dist/activity-graph-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push graphs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
